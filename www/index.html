<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ретро Платформер</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            margin: 0; padding: 0; background: #000; color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; height: 100dvh; overflow: hidden;
        }
        canvas {
            background: #5c94fc; /* Небо как в Марио */
            border: 4px solid #fff;
            image-rendering: pixelated;
        }
        .controls {
            display: flex; gap: 20px; margin-top: 15px;
        }
        .btn-group { display: flex; gap: 10px; }
        button {
            background: #e52521; color: white; border: 2px solid #fff;
            width: 60px; height: 60px; border-radius: 50%;
            font-size: 1.5rem; font-weight: bold;
            box-shadow: 0 4px 0 #8b0000;
        }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 #8b0000; }
        .jump-btn { background: #fbd000; color: #000; box-shadow: 0 4px 0 #b89700; }
        .jump-btn:active { box-shadow: 0 0 0 #b89700; }
        #score { position: absolute; top: 10px; left: 10px; font-size: 1.2rem; font-weight: bold; text-shadow: 2px 2px 0 #000; }
    </style>
</head>
<body>

    <div id="score">Монеты: 0</div>
    <canvas id="game" width="400" height="300"></canvas>

    <div class="controls">
        <div class="btn-group">
            <button id="left">←</button>
            <button id="right">→</button>
        </div>
        <button class="jump-btn" id="jump">↑</button>
    </div>

<script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    
    // Масштабирование под телефон (сохраняем пропорции)
    function resizeCanvas() {
        const maxW = window.innerWidth - 20;
        const maxH = window.innerHeight * 0.65;
        const scale = Math.min(maxW / 400, maxH / 300);
        canvas.style.width = (400 * scale) + 'px';
        canvas.style.height = (300 * scale) + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    window.onload = resizeCanvas;

    // Игровые переменные
    let score = 0;
    let gameOver = false;
    const gravity = 0.5;
    const keys = { right: false, left: false, jump: false };

    // Игрок
    const player = {
        x: 50, y: 200, w: 20, h: 20,
        vx: 0, vy: 0, speed: 4, jumpPower: -9,
        onGround: false
    };

    // Платформы (x, y, width, height)
    const platforms = [
        { x: 0, y: 280, w: 400, h: 20 }, // Земля
        { x: 100, y: 220, w: 80, h: 10 },
        { x: 250, y: 180, w: 100, h: 10 },
        { x: 50, y: 130, w: 60, h: 10 },
        { x: 180, y: 100, w: 60, h: 10 },
        { x: 320, y: 80, w: 60, h: 10 }
    ];

    // Монеты
    let coins = [
        { x: 120, y: 200, w: 10, h: 10, collected: false },
        { x: 280, y: 160, w: 10, h: 10, collected: false },
        { x: 70, y: 110, w: 10, h: 10, collected: false },
        { x: 200, y: 80, w: 10, h: 10, collected: false }
    ];

    // Враги (гумбы)
    let enemies = [
        { x: 200, y: 260, w: 20, h: 20, vx: -1, alive: true },
        { x: 300, y: 260, w: 20, h: 20, vx: 1, alive: true }
    ];

    // Управление (Кнопки)
    document.getElementById('left').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    document.getElementById('left').addEventListener('touchend', () => keys.left = false);
    document.getElementById('left').addEventListener('mousedown', () => keys.left = true);
    document.getElementById('left').addEventListener('mouseup', () => keys.left = false);
    document.getElementById('left').addEventListener('mouseleave', () => keys.left = false);

    document.getElementById('right').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    document.getElementById('right').addEventListener('touchend', () => keys.right = false);
    document.getElementById('right').addEventListener('mousedown', () => keys.right = true);
    document.getElementById('right').addEventListener('mouseup', () => keys.right = false);
    document.getElementById('right').addEventListener('mouseleave', () => keys.right = false);

    document.getElementById('jump').addEventListener('touchstart', (e) => { e.preventDefault(); keys.jump = true; });
    document.getElementById('jump').addEventListener('touchend', () => keys.jump = false);
    document.getElementById('jump').addEventListener('mousedown', () => keys.jump = true);
    document.getElementById('jump').addEventListener('mouseup', () => keys.jump = false);

    // Управление (Клавиатура для ПК)
    document.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowRight') keys.right = true;
        if (e.code === 'ArrowLeft') keys.left = true;
        if (e.code === 'Space' || e.code === 'ArrowUp') keys.jump = true;
    });
    document.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight') keys.right = false;
        if (e.code === 'ArrowLeft') keys.left = false;
        if (e.code === 'Space' || e.code === 'ArrowUp') keys.jump = false;
    });

    function update() {
        if (gameOver) return;

        // Движение по X
        player.vx = 0;
        if (keys.left) player.vx = -player.speed;
        if (keys.right) player.vx = player.speed;
        player.x += player.vx;

        // Границы экрана
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

        // Прыжок
        if (keys.jump && player.onGround) {
            player.vy = player.jumpPower;
            player.onGround = false;
        }

        // Гравитация
        player.vy += gravity;
        player.y += player.vy;

        // Коллизии с платформами
        player.onGround = false;
        platforms.forEach(p => {
            if (player.x < p.x + p.w && player.x + player.w > p.x &&
                player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy) {
                player.vy = 0;
                player.y = p.y - player.h;
                player.onGround = true;
            }
        });

        // Падение за экран
        if (player.y > canvas.height) {
            gameOver = true;
            alert("Игра окончена! Монет собрано: " + score);
            location.reload();
        }

        // Сбор монет
        coins.forEach(c => {
            if (!c.collected && player.x < c.x + c.w && player.x + player.w > c.x &&
                player.y < c.y + c.h && player.y + player.h > c.y) {
                c.collected = true;
                score++;
                document.getElementById('score').innerText = 'Монеты: ' + score;
            }
        });

        // Логика врагов
        enemies.forEach(e => {
            if (!e.alive) return;
            e.x += e.vx;
            
            // Патрулирование
            if (e.x < 150 || e.x > 350) e.vx *= -1;

            // Столкновение с игроком
            if (player.x < e.x + e.w && player.x + player.w > e.x &&
                player.y < e.y + e.h && player.y + player.h > e.y) {
                
                // Если прыгаем сверху — убиваем врага
                if (player.vy > 0 && player.y + player.h < e.y + 10) {
                    e.alive = false;
                    player.vy = -6; // Отскок
                } else {
                    // Иначе умираем
                    gameOver = true;
                    alert("Вас съели! Монет собрано: " + score);
                    location.reload();
                }
            }
        });
    }

    function draw() {
        // Фон
        ctx.fillStyle = '#5c94fc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Земля (коричневая с травой)
        platforms.forEach(p => {
            if (p.y === 280) {
                ctx.fillStyle = '#e52521'; // Кирпичи
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#fff';
                // Рисуем сеточку кирпичей
                for(let i=0; i<p.w; i+=20) {
                    ctx.strokeStyle = '#000';
                    ctx.strokeRect(p.x + i, p.y, 20, p.h);
                }
            } else {
                ctx.fillStyle = '#fbd000'; // Блоки
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(p.x, p.y, p.w, p.h);
            }
        });

        // Монеты
        coins.forEach(c => {
            if (!c.collected) {
                ctx.fillStyle = '#fbd000';
                ctx.beginPath();
                ctx.arc(c.x + 5, c.y + 5, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b89700';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        // Враги (Гумбы)
        enemies.forEach(e => {
            if (e.alive) {
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(e.x, e.y, e.w, e.h);
                // Глаза
                ctx.fillStyle = '#fff';
                ctx.fillRect(e.x + 4, e.y + 4, 4, 6);
                ctx.fillRect(e.x + 12, e.y + 4, 4, 6);
                ctx.fillStyle = '#000';
                ctx.fillRect(e.x + 6, e.y + 6, 2, 4);
                ctx.fillRect(e.x + 14, e.y + 6, 2, 4);
            }
        });

        // Игрок (Марио-подобный)
        ctx.fillStyle = '#e52521'; // Красная кепка/рубашка
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = '#ffcc99'; // Лицо
        ctx.fillRect(player.x + 4, player.y + 4, 12, 8);
        ctx.fillStyle = '#000'; // Глаза
        ctx.fillRect(player.x + 8, player.y + 6, 2, 2);
        ctx.fillRect(player.x + 14, player.y + 6, 2, 2);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
